[package]
name = "filebrary-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Filebrary identity features: TOTP 2FA, scoped API keys, storage quotas, LDAP and OpenID Connect sign-in."
license.workspace = true
repository.workspace = true

[dependencies]
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
hex = "0.4.3"
sha1 = "0.11.0"
percent-encoding = "2.3.2"
# TLS for both is rustls with the ring provider: no OpenSSL or other system C library.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["form"] }
