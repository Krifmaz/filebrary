# Filebrary example configuration.
#
# Every setting is optional; the values below are the defaults unless marked
# "example". Settings are described in full in the settings reference:
# https://krifmaz.github.io/filebrary/configuration/reference.html
#
# Environment variables (FILEBRARY_*) override this file.

# --- Server -----------------------------------------------------------------

# Address and port to listen on. "0.0.0.0:8080" accepts connections from
# other machines. (Default: "127.0.0.1:8080".)
listen = "0.0.0.0:8080" # example

# Database, upload staging area and secret key. Back this up.
data_dir = "/var/lib/filebrary" # example (default: "./data")

# The URL users open. Needed behind a reverse proxy; makes cookies Secure
# when it starts with https://.
public_url = "https://files.example.com" # example (default: not set)

# "text" or "json".
log_format = "text"

# --- Sessions and sign-in ---------------------------------------------------

# Idle time before a login expires, in hours.
session_ttl_hours = 168

# Force the Secure cookie flag. Leave unset to follow public_url.
# secure_cookies = true

# Trust X-Forwarded-For. Only behind a reverse proxy you control.
trust_proxy_headers = false

# Failed logins allowed per client address per window.
login_max_attempts = 5
login_window_secs = 300

# First administrator, created only when there are no users yet. Without a
# password, a random one is logged once. Prefer FILEBRARY_ADMIN_PASSWORD.
admin_username = "admin"
# admin_password = "change-me"

# --- Uploads ----------------------------------------------------------------

# Largest resumable-upload chunk, in MiB (1-4096).
max_chunk_mib = 64

# Largest file accepted through a public drop link, in MiB.
max_drop_upload_mib = 1024

# Discard unfinished uploads after this many hours.
upload_expiry_hours = 24

# --- Trash and activity log -------------------------------------------------

# Days before trashed items are purged; 0 makes deletes permanent.
trash_retention_days = 30

# Days activity-log events are kept; 0 keeps them forever.
activity_retention_days = 365

# --- WebDAV -----------------------------------------------------------------

# Serve WebDAV at /dav/ (Windows Explorer, macOS Finder, rclone).
webdav = true

# --- Search -----------------------------------------------------------------

[search]
enabled = true                # build and maintain the file index
watch = true                  # follow changes on local sources (inotify, ...)
rescan_minutes = 60           # full rescan of sources that are not watched
watched_rescan_hours = 24     # safety-net rescan of watched sources; 0 = off
exclude_sources = []          # sources never indexed
batch_size = 500              # rows per transaction while scanning

# --- Sources ----------------------------------------------------------------
# With no [[sources]], <data_dir>/files is served as "files".

[[sources]]
name = "files"        # a-z, 0-9, '-', '_'; 1-32 characters; unique
kind = "local"        # the default
path = "/srv/files"

[[sources]]
name = "media"
path = "/mnt/pool/media"   # a mergerfs or other FUSE mount works too

# Remote sources: uncomment one block and fill it in. They connect on first
# use, so an unreachable server does not stop Filebrary from starting.

# An S3-compatible bucket (AWS, MinIO, Garage, R2, B2, ...).
# [[sources]]
# name = "photos"
# kind = "s3"
# [sources.s3]
# bucket = "family-photos"
# prefix = ""                    # serve only this part of the bucket
# endpoint = "http://minio:9000" # omit for AWS
# region = "us-east-1"
# access_key_id = "AKIA..."      # unset: AWS_* variables or instance metadata
# secret_access_key = "..."
# secret_access_key_file = "/run/secrets/s3_secret"   # wins over the above
# session_token = "..."
# virtual_hosted_style = false   # default: false with endpoint, true on AWS

# A directory on an SFTP server. Pin the host key; the error of a first
# attempt without it names the server's fingerprint.
# [[sources]]
# name = "nas"
# kind = "sftp"
# [sources.sftp]
# host = "nas.lan"
# port = 22
# username = "filebrary"
# password = "..."
# password_file = "/run/secrets/nas_password"
# private_key = "/run/secrets/nas_ed25519"
# private_key_passphrase = "..."
# root = "/volume1/shared"       # empty: the home directory
# host_key_fingerprint = "SHA256:..."
# known_hosts = "/data/known_hosts"
# insecure_accept_any_host_key = false   # tests only

# A folder on an SMB 2/3 share (Windows, Samba, NAS).
# [[sources]]
# name = "office"
# kind = "smb"
# [sources.smb]
# host = "fileserver.lan"
# port = 445
# share = "Projects"
# root = ""                      # folder inside the share
# username = "filebrary"         # empty: guest
# password = "..."
# password_file = "/run/secrets/smb"
# domain = ""

# --- FTP server -------------------------------------------------------------
# Off by default. Same users, passwords and permissions as the web UI.

[ftp]
enabled = false
listen = "0.0.0.0:2121"
passive_ports = [50000, 50100]   # publish the range too in Docker
# passive_host = "203.0.113.7"   # example: public address behind NAT/Docker
max_login_attempts = 5
login_block_secs = 300
idle_timeout_secs = 600
greeting = "Filebrary FTP server ready"

# Explicit FTPS. Strongly recommended: without it passwords are sent in clear.
# [ftp.tls]
# cert = "/data/tls/cert.pem"   # example
# key = "/data/tls/key.pem"     # example
# mode = "required"             # or "optional"

# --- Notifications ----------------------------------------------------------

[notifications]
instance = "Filebrary"          # shown in every notification
quota_warning_percent = 90

[notifications.retry]
attempts = 4
initial_backoff_ms = 1000
timeout_secs = 10

# [[notifications.webhooks]]
