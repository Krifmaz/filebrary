# Filebrary example configuration.
#
# Every setting is optional; the values below are the defaults unless marked
# "example". Settings are described in full in the settings reference:
# https://krifmaz.github.io/filebrary/configuration/reference.html
#
# Environment variables (FILEBRARY_*) override this file.

# --- Server -----------------------------------------------------------------

# Address and port to listen on. "0.0.0.0:8080" accepts connections from
# other machines. (Default: "127.0.0.1:8080".)
listen = "0.0.0.0:8080" # example

# Database, upload staging area and secret key. Back this up.
data_dir = "/var/lib/filebrary" # example (default: "./data")

# The URL users open. Needed behind a reverse proxy; makes cookies Secure
# when it starts with https://.
public_url = "https://files.example.com" # example (default: not set)

# "text" or "json".
log_format = "text"

# --- Sessions and sign-in ---------------------------------------------------

# Idle time before a login expires, in hours.
session_ttl_hours = 168

# Force the Secure cookie flag. Leave unset to follow public_url.
# secure_cookies = true

# Trust X-Forwarded-For. Only behind a reverse proxy you control.
trust_proxy_headers = false

# Failed logins allowed per client address per window.
login_max_attempts = 5
login_window_secs = 300

# First administrator, created only when there are no users yet. Without a
# password, a random one is logged once. Prefer FILEBRARY_ADMIN_PASSWORD.
admin_username = "admin"
# admin_password = "change-me"

# --- Uploads ----------------------------------------------------------------

# Largest resumable-upload chunk, in MiB (1-4096).
max_chunk_mib = 64

# Largest file accepted through a public drop link, in MiB.
max_drop_upload_mib = 1024

# Discard unfinished uploads after this many hours.
upload_expiry_hours = 24

# --- Trash and activity log -------------------------------------------------

# Days before trashed items are purged; 0 makes deletes permanent.
trash_retention_days = 30

# Days activity-log events are kept; 0 keeps them forever.
activity_retention_days = 365

# --- WebDAV -----------------------------------------------------------------

# Serve WebDAV at /dav/ (Windows Explorer, macOS Finder, rclone).
webdav = true

# --- Two-factor login and quotas ------------------------------------------

# Name shown in authenticator apps.
totp_issuer = "Filebrary"

# Storage limit for users without their own, e.g. "10G". Unset: unlimited.
# default_quota = "10G"

# Hours between measurements of real usage; 0 turns it off.
quota_rescan_hours = 6

# --- Single sign-on (OpenID Connect) ----------------------------------------
# Uncomment [oidc] to turn it on. Needs public_url. Register
# <public_url>/api/auth/oidc/callback as the redirect URL at the provider.

# [oidc]
# issuer_url = "https://auth.example.com"
# client_id = "filebrary"
# client_secret = "..."                 # or FILEBRARY_OIDC_CLIENT_SECRET
# client_secret_file = "/run/secrets/oidc_client_secret"
# scopes = ["profile", "email", "groups"]
# username_claim = "preferred_username"
# groups_claim = "groups"
# admin_group = "filebrary-admins"
# allowed_groups = []
# auto_create = true
# button_label = "Sign in with SSO"
# disable_password_login = false

# --- LDAP -------------------------------------------------------------------
# Uncomment [ldap] to let directory users sign in with their password.

# [ldap]
# url = "ldaps://ldap.example.com"
# starttls = false
# bind_dn = "cn=filebrary,ou=services,dc=example,dc=com"
# bind_password = "..."                 # or FILEBRARY_LDAP_BIND_PASSWORD
# bind_password_file = "/run/secrets/ldap_password"
# base_dn = "ou=people,dc=example,dc=com"
# user_filter = "(&(objectClass=person)(uid={username}))"
# username_attribute = "uid"
# email_attribute = "mail"
# display_name_attribute = "cn"
# group_attribute = "memberOf"
# required_group = "cn=filebrary-users,ou=groups,dc=example,dc=com"
# admin_group = "cn=filebrary-admins,ou=groups,dc=example,dc=com"
# timeout_secs = 10

# --- Search -----------------------------------------------------------------

[search]
enabled = true                # build and maintain the file index
watch = true                  # follow changes on local sources (inotify, ...)
rescan_minutes = 60           # full rescan of sources that are not watched
watched_rescan_hours = 24     # safety-net rescan of watched sources; 0 = off
exclude_sources = []          # sources never indexed
batch_size = 500              # rows per transaction while scanning

# --- Previews ---------------------------------------------------------------
# Thumbnails and previews. Video, HEIC, PDF and Office need the tools in the
# -full image (ffmpeg, heif-dec, pdftoppm, soffice).

[previews]
enabled = true
cache_mib = 2048        # LRU cache in <data_dir>/cache/previews
thumb_size = 256        # 32-1024 px
large_size = 1920       # 256-8192 px
max_parallel = 0        # 0 = one per CPU, at most 8
max_remote_mib = 1024   # largest remote file copied locally for a preview

# --- Sources ----------------------------------------------------------------
# With no [[sources]], <data_dir>/files is served as "files".

[[sources]]
name = "files"        # a-z, 0-9, '-', '_'; 1-32 characters; unique
kind = "local"        # the default
path = "/srv/files"
content_search = true # index the text inside documents (the default)

[[sources]]
name = "media"
path = "/mnt/pool/media"   # a mergerfs or other FUSE mount works too
content_search = false     # mostly photos and video: skip content indexing

# Remote sources: uncomment one block and fill it in. They connect on first
# use, so an unreachable server does not stop Filebrary from starting.

# An S3-compatible bucket (AWS, MinIO, Garage, R2, B2, ...).
# [[sources]]
# name = "photos"
# kind = "s3"
# [sources.s3]
# bucket = "family-photos"
# prefix = ""                    # serve only this part of the bucket
# endpoint = "http://minio:9000" # omit for AWS
# region = "us-east-1"
# access_key_id = "AKIA..."      # unset: AWS_* variables or instance metadata
# secret_access_key = "..."
# secret_access_key_file = "/run/secrets/s3_secret"   # wins over the above
# session_token = "..."
# virtual_hosted_style = false   # default: false with endpoint, true on AWS

# A directory on an SFTP server. Pin the host key; the error of a first
# attempt without it names the server's fingerprint.
# [[sources]]
# name = "nas"
# kind = "sftp"
# [sources.sftp]
# host = "nas.lan"
# port = 22
# username = "filebrary"
# password = "..."
# password_file = "/run/secrets/nas_password"
# private_key = "/run/secrets/nas_ed25519"
# private_key_passphrase = "..."
# root = "/volume1/shared"       # empty: the home directory
# host_key_fingerprint = "SHA256:..."
# known_hosts = "/data/known_hosts"
# insecure_accept_any_host_key = false   # tests only

# A folder on an SMB 2/3 share (Windows, Samba, NAS).
# [[sources]]
# name = "office"
# kind = "smb"
# [sources.smb]
# host = "fileserver.lan"
# port = 445
# share = "Projects"
# root = ""                      # folder inside the share
# username = "filebrary"         # empty: guest
# password = "..."
# password_file = "/run/secrets/smb"
# domain = ""

# --- FTP server -------------------------------------------------------------
# Off by default. Same users, passwords and permissions as the web UI.

[ftp]
enabled = false
listen = "0.0.0.0:2121"
passive_ports = [50000, 50100]   # publish the range too in Docker
# passive_host = "203.0.113.7"   # example: public address behind NAT/Docker
max_login_attempts = 5
login_block_secs = 300
idle_timeout_secs = 600
greeting = "Filebrary FTP server ready"

# Explicit FTPS. Strongly recommended: without it passwords are sent in clear.
# [ftp.tls]
# cert = "/data/tls/cert.pem"   # example
# key = "/data/tls/key.pem"     # example
# mode = "required"             # or "optional"

# --- Notifications ----------------------------------------------------------

[notifications]
instance = "Filebrary"          # shown in every notification
quota_warning_percent = 90

[notifications.retry]
attempts = 4
initial_backoff_ms = 1000
timeout_secs = 10

# [[notifications.webhooks]]
# name = "automation"                         # unique across all targets
# url = "https://hooks.example.com/filebrary" # example
# secret = "shared secret"                    # signs each request
# headers = { Authorization = "Bearer abc" }  # example
# events = ["upload", "job_failed"]           # empty: every event

# [[notifications.ntfy]]
# name = "phone"
# server = "https://ntfy.sh"
# topic = "my-filebrary"   # example
# token = "tk_..."         # or username + password
# username = "me"
# password = "..."
# click = "https://files.example.com"
# events = []

# [[notifications.email]]
# name = "admin-mail"
# smtp_host = "smtp.example.com"
# smtp_port = 587               # default depends on security
# security = "starttls"         # tls | starttls | none
# username = "files@example.com"
# password = "..."
# from = "Filebrary <files@example.com>"
# to = ["admin@example.com"]
# events = ["quota_near_full", "job_failed"]

# --- Metrics ----------------------------------------------------------------

[metrics]
enabled = true
# token = "a long random string"   # scrapers send Authorization: Bearer <token>

# --- Jobs, conversions and archives ----------------------------------------

[jobs]
# Jobs that run at the same time (1-64). Conversions are CPU heavy.
workers = 2
# Days finished jobs stay in the job list.
retain_days = 7
# Conversion tools: a name looked up on PATH, or a full path. The -full
# Docker image includes all three.
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
soffice = "soffice"
# Longest one external program may run, in seconds.
timeout_secs = 21600
# Most files one "create archive" job may pack.
max_archive_files = 200000
# Most entries listed when browsing inside an archive.
max_archive_entries = 100000
# Largest single file that can be read out of an archive, in MiB.
max_archive_entry_mib = 4096

# Custom jobs: defined here only, never from the web UI. The program runs
# directly (no shell) on a private copy of the file.
# [[jobs.custom]]
# name = "optimise-png"            # a-z, 0-9, '-', '_'; kind "custom.<name>"
# title = "Optimise PNG"
# description = "Losslessly shrink PNG files"
# program = "optipng"
# args = ["-quiet", "-o2", "{input}"]   # placeholders: {input} {output_dir} {ext}
# extensions = ["png"]             # empty: any file
# output = "replace"               # none | replace | files
# permission = "download"          # download | upload | edit
# admin_only = false
# timeout_secs = 600               # default: jobs.timeout_secs
# env = { OPTIPNG_LEVEL = "2" }
# workdir = "/var/tmp"             # default: the job's private folder

# --- Content search ---------------------------------------------------------
# Full-text index of text, PDF and Office files, in <data_dir>/fulltext.

[fulltext]
enabled = true              # FILEBRARY_FULLTEXT; off: no content index at all
max_file_mib = 32           # larger files are not read for content
max_chars = 1000000         # characters indexed per file
writer_memory_mib = 24      # indexing buffer, freed after each commit
commit_every_docs = 500     # changes become searchable after this many...
commit_interval_secs = 5    # ...or this many seconds
