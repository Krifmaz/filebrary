[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Krifmaz/filebrary"

# Shared versions: member crates should use `dep = { workspace = true }` for
# anything listed here so the whole workspace stays on one version.
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "macros", "tracing"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie", "query"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"
base64 = "0.23.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tempfile = "3.27.0"
# Remote storage backends (all pure Rust; TLS and signing use ring, not aws-lc).
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# TLS for the S3 client: rustls with the ring provider (no aws-lc, no OpenSSL).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
smb2 = "0.39.0"
# Archives: pure-Rust codecs only (no C libraries).
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
sevenz-rust2 = { version = "0.24.2", default-features = false }
# Image decoding/encoding for conversions and thumbnails: pure-Rust codecs only.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
