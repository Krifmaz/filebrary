# Filebrary's new web UI: Leptos (client-side, WebAssembly) on the kit's components and the kit's Encore theme,
# built by trunk into ui/dist and served by the server at /next/ until it replaces the React UI in web/.
# A Cargo workspace of its own (like the kit template's web/), so the server's graph stays untouched.
[workspace]
resolver = "2"

[package]
# `<project>-web`: trunk names the script `filebrary-web-<hash>.js`, and the kit reads the project name from it.
name = "filebrary-web"
description = "Filebrary's web UI on the kit."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The kit, pinned to one tag (keep in step with the server's kit crates).
[dependencies]
kit-leptos = { git = "https://github.com/Krifmaz/kit", tag = "v0.3.2" }
kit-rules = { git = "https://github.com/Krifmaz/kit", tag = "v0.3.2" }
leptos = { version = "=0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlDocument", "HtmlInputElement", "History", "Location", "Window", "Storage", "MouseEvent", "KeyboardEvent", "MediaQueryList"] }

[lints.rust]
missing_docs = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
