# Continuous integration on every pull request, through the kit's shared
# checks (Krifmaz/kit kit-ci: fmt, clippy -D warnings, tests, and the Leptos
# UI in ui/) plus the checks only Filebrary has: the React web UI (until the
# Leptos UI replaces it),
# storage backends against real servers, Windows, the docs book and a smoke
# test of the Docker image.
#
# Pushes to main run the same kit checks inside release.yml before releasing.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.3.2
    with:
      rust-dirs: .
      runs-on: ${{ matrix.os }}
      # Doc comments build cleanly (Linux only: the docs are the same everywhere).
      check: |
        if [ "$RUNNER_OS" = Linux ]; then
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
        fi

  # The Leptos UI in ui/ (its own Cargo workspace): kit-ci's web app checks
  # (fmt, wasm32 check and clippy -D warnings, tests, among them the check that
  # static/css/kit.css matches the pinned kit), then a release build with trunk.
  ui:
    name: Leptos UI
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.3.2
    with:
      rust-dirs: ""
      wasm-dirs: ui
      check: |
        curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz -C /usr/local/bin trunk
        cd ui && trunk build --release
        test -f dist/index.html && ls dist/*_bg.wasm

  # kit-ci's steps run in bash, which Windows runners do not use by default,
  # so Windows keeps its own job.
  windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build

  backends:
    name: Storage backends (MinIO, SFTP, Samba)
    runs-on: ubuntu-latest
    env:
      # Keep in step with MINIO_VERSION in scripts/test-backends.sh.
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minio-bin
          key: minio-${{ env.MINIO_VERSION }}
      - if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.cache/minio-bin" go install "github.com/minio/minio@$MINIO_VERSION"
      - name: Backend tests
        run: MINIO_BIN="$HOME/.cache/minio-bin/minio" scripts/test-backends.sh

  # The release image is built by kit-docker; here the same Dockerfile is
  # built once for amd64, loaded, size-checked and started, which kit-docker's
  # build-only mode cannot do.
  docker:
    name: Docker image (build, size, smoke test)
    runs-on: ubuntu-latest
    env:
      MAX_IMAGE_MB: "60"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build default image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: filebrary:ci
          build-args: APP_VERSION=0.0.99
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size
        run: |
          bytes=$(docker image inspect filebrary:ci --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "Image size: ${mb} MB (limit ${MAX_IMAGE_MB} MB)"
          echo "### Docker image size: ${mb} MB (limit ${MAX_IMAGE_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          test "$mb" -lt "$MAX_IMAGE_MB"
      - name: Smoke test
        run: |
          docker run -d --name fb -p 8080:8080 filebrary:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          # The image reports the version it was built as (APP_VERSION).
          curl -sS http://127.0.0.1:8080/readyz | tee ready.json; echo
          grep -q '"version":"0.0.99"' ready.json || { echo "::error::the image does not report the version it was built as"; exit 1; }
          docker exec fb /usr/local/bin/filebrary healthcheck
          echo "Idle memory:"
          docker stats --no-stream --format '{{.MemUsage}}' fb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs fb || true

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
