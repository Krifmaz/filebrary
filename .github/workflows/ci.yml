# Continuous integration: formatting, lints, tests and builds on every push
# and pull request, for Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  NODE_VERSION: "22"

jobs:
  web:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # The server builds without the UI (rust-embed allows a missing
      # web/dist), so every web step is skipped until web/ exists.
      - id: check
        working-directory: .
        run: echo "present=${{ hashFiles('web/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.check.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run build
      - if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: Rust (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: needs.web.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Doc comments build cleanly
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  backends:
    name: Storage backends (MinIO, SFTP, Samba)
    runs-on: ubuntu-latest
    env:
      # Keep in step with MINIO_VERSION in scripts/test-backends.sh.
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minio-bin
          key: minio-${{ env.MINIO_VERSION }}
      - if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.cache/minio-bin" go install "github.com/minio/minio@$MINIO_VERSION"
      - name: Backend tests
        run: MINIO_BIN="$HOME/.cache/minio-bin/minio" scripts/test-backends.sh

  musl:
    name: Static Linux binary (musl)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: needs.web.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin filebrary
      - name: Check the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/filebrary
          file target/x86_64-unknown-linux-musl/release/filebrary | grep -Eq 'static(ally|-pie) linked'
          ls -lh target/x86_64-unknown-linux-musl/release/filebrary

  docker:
    name: Docker image (build, size, smoke test)
    needs: web
    if: needs.web.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      MAX_IMAGE_MB: "60"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build default image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: filebrary:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size
        run: |
          bytes=$(docker image inspect filebrary:ci --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "Image size: ${mb} MB (limit ${MAX_IMAGE_MB} MB)"
          echo "### Docker image size: ${mb} MB (limit ${MAX_IMAGE_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          test "$mb" -lt "$MAX_IMAGE_MB"
      - name: Smoke test
        run: |
          docker run -d --name fb -p 8080:8080 filebrary:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec fb /usr/local/bin/filebrary healthcheck
          echo "Idle memory:"
          docker stats --no-stream --format '{{.MemUsage}}' fb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs fb || true

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-book
          path: docs/book
          retention-days: 7
