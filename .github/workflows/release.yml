# Release: every push to main makes a normal GitHub release vMAJOR.MINOR.PATCH
# (never a pre-release) through the kit's shared workflows (Krifmaz/kit):
#
#   test     kit-ci: fmt, clippy -D warnings, tests
#   prepare  kit-release: picks the version (PATCH by default; a pull request
#            raises MINOR or MAJOR by adding docs/releases/<version>.md, which
#            is also the release notes, otherwise the commit list) and builds
#            the web UI in ui/ with trunk.
#   binaries Filebrary's own: the server with the web UI embedded, for
#            Linux (static musl, x86_64 + aarch64), macOS and Windows.
#   docker   kit-docker: ghcr.io/<owner>/filebrary:<version> and :latest, and
#            the ffmpeg + LibreOffice variant as :<version>-full / :latest-full.
#   publish  kit-release: notes, SHA256SUMS over every file, the release.
#
# Every build is stamped with the release version (APP_VERSION), so the binary,
# the image and the release all report the same version without a commit that
# bumps Cargo.toml. Actions -> Release -> Run workflow picks the bump or types
# the version by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which number to bump for the next version
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Or type the version to release (MAJOR.MINOR.PATCH); overrides bump
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.7.4
    with:
      rust-dirs: .
      wasm-dirs: ui

  prepare:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.7.4
    with:
      stage: prepare
      app-name: Filebrary
      bump: ${{ inputs.bump || 'auto' }}
      version: ${{ inputs.version || '' }}
      # The web UI: kit-release builds ui/ with trunk into the ui-dist
      # artifact, which the binaries embed.
      web-dir: ui

  # kit-release's server build packs a trunk web app next to a Linux binary;
  # Filebrary embeds its UI at compile time and also ships macOS and Windows
  # binaries, so it builds them here. The artifacts are named server-*, which
  # kit-release's publish stage collects into the release.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-latest,     archive: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-latest,     archive: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   archive: zip }
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml picks the toolchain; add the target to that one.
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Stamp the release version
        shell: bash
        run: |
          # The first `version =` in the root manifest is [workspace.package];
          # every workspace crate is named filebrary*, so the lock follows.
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$APP_VERSION\"/m" Cargo.toml
          perl -0pi -e "s/(name = \"filebrary(?:-[a-z0-9-]+)?\"\r?\nversion = )\"[^\"]*\"/\$1\"$APP_VERSION\"/g" Cargo.lock
          grep -m1 '^version' Cargo.toml
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --locked --target ${{ matrix.target }} --bin filebrary
      - name: Package
        shell: bash
        run: |
          name="filebrary-${APP_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin=filebrary
          [[ "${{ matrix.target }}" == *windows* ]] && bin=filebrary.exe
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/" 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  docker:
    needs: prepare
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.7.4
    with:
      image: filebrary
      version: ${{ needs.prepare.outputs.version }}
      build-args: |
        APP_VERSION=${{ needs.prepare.outputs.version }}

  # The same image with ffmpeg + LibreOffice (Dockerfile VARIANT=full), tagged
  # on the same repository as :<version>-full and :latest-full.
  docker-full:
    needs: prepare
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.7.4
    with:
      image: filebrary
      extra-tags: |
        ${{ needs.prepare.outputs.version }}-full
        latest-full
      build-args: |
        APP_VERSION=${{ needs.prepare.outputs.version }}
        VARIANT=full

  publish:
    needs: [prepare, binaries, docker, docker-full]
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.7.4
    with:
      stage: publish
      app-name: Filebrary
      version: ${{ needs.prepare.outputs.version }}
