# Release: on a version tag (v1.2.3), build binaries for every platform,
# publish them to a GitHub release with checksums, and push multi-arch
# Docker images (default and -full) to ghcr.io.
#
# Also called by tag-release.yml, because a tag created with GITHUB_TOKEN
# does not start this workflow by itself.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  binaries:
    name: Binary (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-latest,     archive: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-latest,     archive: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml picks the toolchain; add the target to that one.
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --locked --target ${{ matrix.target }} --bin filebrary
      - name: Package
        shell: bash
        run: |
          version="${TAG#v}"
          name="filebrary-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin=filebrary
          [[ "${{ matrix.target }}" == *windows* ]] && bin=filebrary.exe
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/" 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            file="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            file="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"
          else shasum -a 256 "$file" > "$file.sha256"; fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  github-release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*

  docker:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: default, target: runtime, suffix: "" }
          - { variant: full,    target: full,    suffix: "-full" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/filebrary
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: true
          sbom: true
